name: Secure File Transfer - CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    name: Test Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v5

      - name: Set Up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install Runtime Dependencies
        run: python -m pip install -r requirements.txt

      - name: Install Development Dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run Automated Tests
        run: python -m pytest -v

  build:
    name: Validate Application Build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v5

      - name: Set Up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Validate Python Files
        run: |
          python -m py_compile main.py
          python -m py_compile web/app.py
          python -m py_compile core/crypto.py
          python -m py_compile core/keygen.py
          python -m py_compile core/network.py
          python -m py_compile core/logger.py

      - name: Create Build Artifact
        run: |
          mkdir -p build
          cp -r core build/
          cp -r web build/
          cp main.py build/
          cp requirements.txt build/
          cp README.md build/

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: secure-file-transfer-build
          path: build/